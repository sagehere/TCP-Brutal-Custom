name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  kernel-module:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: 5.10.269
            arch: x86
            compiler: gcc
          - kernel: 6.1.187
            arch: x86
            compiler: clang
          - kernel: 6.6.156
            arch: arm64
            compiler: gcc
          - kernel: 6.12.109
            arch: arm64
            compiler: clang
          - kernel: 7.2.4
            arch: x86
            compiler: gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison clang flex gcc-aarch64-linux-gnu lld llvm \
            libelf-dev libssl-dev make xz-utils
      - name: Prepare Linux ${{ matrix.kernel }}
        env:
          KERNEL_VERSION: ${{ matrix.kernel }}
          KERNEL_ARCH: ${{ matrix.arch }}
          KERNEL_COMPILER: ${{ matrix.compiler }}
        run: |
          major=${KERNEL_VERSION%%.*}
          curl -fsSLO "https://cdn.kernel.org/pub/linux/kernel/v${major}.x/linux-${KERNEL_VERSION}.tar.xz"
          tar -xf "linux-${KERNEL_VERSION}.tar.xz"
          args=(ARCH="$KERNEL_ARCH")
          if [[ $KERNEL_COMPILER == clang ]]; then
            args+=(LLVM=1)
          elif [[ $KERNEL_ARCH == arm64 ]]; then
            args+=(CROSS_COMPILE=aarch64-linux-gnu-)
          fi
          make -C "linux-${KERNEL_VERSION}" "${args[@]}" defconfig
          make -C "linux-${KERNEL_VERSION}" "${args[@]}" modules_prepare
          make KERNEL_DIR="$PWD/linux-${KERNEL_VERSION}" "${args[@]}" \
            KBUILD_MODPOST_WARN=1

  userspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build CLI and run user-space tests
        run: |
          make -C tools
          cc -O2 -Wall -Wextra -Werror -o /tmp/app-group-netns tests/app-group-netns.c
          bash tests/install-manager-test.sh
          bash tests/release-chain-test.sh
          release_test_dir=$(mktemp -d)
          ./scripts/build-release-assets.sh v2.5.1 2.5.1 "$(git rev-parse HEAD)" "$release_test_dir"
          test -x "$release_test_dir/install.sh"
          grep -Eq '  install[.]sh$' "$release_test_dir/SHA256SUMS"
          (cd "$release_test_dir" && sha256sum -c SHA256SUMS)
          rm -rf "$release_test_dir"
          bash tests/brutalctl-safety.sh
          bash tests/brutalctl-route-ownership.sh
          sudo env TBC_TEST_CC=reno bash tests/brutalctl-route-netns.sh
          sudo env TBC_TEST_CC=reno bash tests/port-mode-preflight-netns.sh
          sudo bash tests/aggregate-egress-netns.sh
          sudo env TBC_TEST_CC=reno bash tests/port-mode-netns.sh
