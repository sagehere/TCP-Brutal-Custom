name: Publish v2.3.0 release assets

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-v2.3.0-assets.yml

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2.3.0
        uses: actions/checkout@v4
        with:
          ref: v2.3.0
          fetch-depth: 0

      - name: Verify release version
        run: |
          set -euo pipefail
          version=$(./scripts/mkdkmsconf.sh | sed -n 's/^PACKAGE_VERSION="\(.*\)"$/\1/p')
          test "$version" = "2.3.0"
          test "$(git rev-parse HEAD)" = "31ee60cd35200acfb78fa4a2334a10e97c2f0e2a"

      - name: Build DKMS release assets
        run: |
          set -euo pipefail
          make dkms-tarball
          mkdir -p build
          mv dkms.tar.gz build/tcp-brutal.dkms.tar.gz
          (cd build && sha256sum tcp-brutal.dkms.tar.gz > hashes.txt)

      - name: Upload assets to existing v2.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v2.3.0 build/tcp-brutal.dkms.tar.gz build/hashes.txt --clobber --repo "$GITHUB_REPOSITORY"

      - name: Self-remove asset publisher
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fdx
          git fetch origin master
          git switch --force master
          git rm .github/workflows/publish-v2.3.0-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: remove v2.3.0 asset publisher"
          git push origin HEAD:master
