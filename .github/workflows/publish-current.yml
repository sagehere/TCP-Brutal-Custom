name: Publish current release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-current.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version=$(./scripts/mkdkmsconf.sh | sed -n 's/^PACKAGE_VERSION="\(.*\)"$/\1/p')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Ensure tag is new
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "tag already exists: ${{ steps.version.outputs.tag }}"
            exit 1
          fi

      - name: Build release assets
        run: |
          make dkms-tarball
          mkdir -p build/
          mv dkms.tar.gz build/tcp-brutal.dkms.tar.gz
          for file in build/*; do
            sha256sum "$file" >> build/hashes.txt
          done

      - name: Create GitHub release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.target.outputs.sha }}
          name: TCP Brutal Custom ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/*
